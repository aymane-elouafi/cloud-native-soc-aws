    <rect x="712" y="200" width="118" height="28" rx="14" fill="#2563eb"/>
    <text x="771" y="219" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">WAF · ModSec</text>
    <text x="848" y="219" font-size="16" fill="#1e293b">100301 · 100302</text>
